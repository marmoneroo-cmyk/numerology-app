<!-- Supabase: Authentication, Emails, Templates, "Reset password". Subject: הקוד לבחירת סיסמה חדשה. The app's "forgot password" screen asks for this 6-digit code ({{ .Token }}); a link would not work there. -->
<div dir="rtl" style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; color: #2a2520; max-width: 480px;">
  <h2 style="color: #6f5629; font-size: 22px; margin: 0 0 12px;">בחירת סיסמה חדשה</h2>
  <p>התקבלה בקשה לבחור סיסמה חדשה לחשבון בסטודיו.</p>
  <p>זה הקוד, להקלדה במסך "שכחתי סיסמה":</p>
  <p dir="ltr" style="font-size: 30px; font-weight: bold; letter-spacing: 8px; text-align: center; margin: 20px 0;">{{ .Token }}</p>
  <p>הקוד בתוקף לשעה.</p>
  <p>אם לא ביקשתם סיסמה חדשה, אפשר להתעלם מהמייל הזה. הסיסמה לא תשתנה.</p>
</div>
